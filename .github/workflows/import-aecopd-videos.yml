name: Import uploaded AECOPD videos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-aecopd-videos.yml"

permissions:
  contents: write

jobs:
  import-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download uploaded videos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scenarios/aecopd/assets/video
          curl -fL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-2568-81f5-aa61-480f3225a089/raw?se=2026-09-25T13%3A59%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=7b95d580-e302-5170-afd7-04e3210b13b9&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T01%3A26%3A07Z&ske=2026-09-26T01%3A26%3A07Z&sks=b&skv=2026-02-06&sig=e6EN8wBTLA6ibu17Y1kIIZSI7UrVBbA5ZYj2JsD0BIY%3D' -o scenarios/aecopd/assets/video/video2-1-breathing.mp4
          curl -fL 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-46b8-8206-aec3-f58da0ff4c7b/raw?se=2026-09-25T13%3A59%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=28254497-12de-56ac-943a-604a8a914c7c&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T08%3A07%3A58Z&ske=2026-09-26T08%3A07%3A58Z&sks=b&skv=2026-02-06&sig=xAN9m3J0P56%2B2vEW6QWQlzHp3NbbMv4EyGNvKF1xIMM%3D' -o scenarios/aecopd/assets/video/video3-oxygen-scene.mp4
          test -s scenarios/aecopd/assets/video/video2-1-breathing.mp4
          test -s scenarios/aecopd/assets/video/video3-oxygen-scene.mp4
      - name: Commit videos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenarios/aecopd/assets/video/video2-1-breathing.mp4 scenarios/aecopd/assets/video/video3-oxygen-scene.mp4
          git diff --cached --quiet && exit 0
          git commit -m "assets: add two uploaded AECOPD patient videos"
          git push
